name: CodeQL

# Static analysis, configured for Go. Free because this repo is public — one of the
# main reasons it is public. Given the daemon spawns unsandboxed sessions, the
# `security-and-quality` query suite is the minimum, not a nice-to-have.

on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'        # weekly, Monday 04:27 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write     # required to upload results to the Security tab
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # GitHub-hosted. From #77 (8/6/26) this ran on crswd-runner-1/2, lab VMs on
    # VLAN 19, after hosted runners stalled for six hours. By 11/26/26 both were
    # gone (runner-1 offline, runner-2 unregistered, alongside the sgt and
    # nodewright runners on the same hosts), and every PR sat queued 24 h and was
    # cancelled. This repo is public: hosted minutes are free here, and a public
    # repo's pull requests must not run on the lab's own machines.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves — worth having regardless of Go,
        # and it catches workflow-injection, which matters because claude-issue.yml
        # feeds attacker-influenced issue text to an agent.
        language: [go, actions]

    steps:
      - uses: actions/checkout@v7

      # CodeQL fails hard with "no source code seen" rather than skipping, so the
      # Go analysis stays off until there is Go to analyse. It switches itself on
      # with the first commit that adds go.mod — no edit needed here.
      - name: Source present for ${{ matrix.language }}?
        id: src
        run: |
          if [ "${{ matrix.language }}" = "go" ] && [ ! -f go.mod ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod yet — skipping CodeQL for Go."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Go is preinstalled on GitHub-hosted runners and not on the lab's own,
      # so autobuild failed with `exec: "go": executable file not found` the
      # first time this ran on self-hosted (#77). ci.yml already installs its
      # own toolchain for exactly this reason; this had been relying on the
      # image instead.
      #
      # Same version ci.yml pins, and for the same argument: CodeQL analysing a
      # different Go than the one that builds and tests is analysing a different
      # program.
      - name: Set up Go
        if: steps.src.outputs.present == 'true' && matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Initialize CodeQL
        if: steps.src.outputs.present == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        if: steps.src.outputs.present == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        if: steps.src.outputs.present == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
