name: Dependency review

# Blocks a PR that introduces a vulnerable or badly-licensed dependency.
# Free because this repo is public.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    # GitHub-hosted. From #77 (8/6/26) this ran on crswd-runner-1/2, lab VMs on
    # VLAN 19, after hosted runners stalled for six hours. By 11/26/26 both were
    # gone (runner-1 offline, runner-2 unregistered, alongside the sgt and
    # nodewright runners on the same hosts), and every PR sat queued 24 h and was
    # cancelled. This repo is public: hosted minutes are free here, and a public
    # repo's pull requests must not run on the lab's own machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # This project is MIT and vendors almost nothing (see docs/security.md §5).
          # Copyleft would force a licence change, so it is refused outright.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
