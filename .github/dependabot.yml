version: 2
updates:
  # Keep the automation itself current — pinned action SHAs/tags go stale and
  # stale actions are a supply-chain risk.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(actions)"
    # Group routine bumps into ONE PR to cut review noise. Majors stay
    # separate and manual on purpose — a silent major bump is exactly how
    # a breaking workflow change (renamed input, dropped context) slips in.
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The daemon leans on stdlib by design (see docs/security.md §5), so this list
  # should stay short. A noisy gomod section means the dependency budget slipped.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The cluster module carries client-go by design (spec 017, decision 1
  # option A); the root list above stays stdlib-only. Dependabot fails on a
  # directory that does not exist, so this lands with k8s/go.mod.
  - package-ecosystem: gomod
    directory: "/k8s"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
