image:
  repository: ghcr.io/craig-ai-tooling/crswd # the daemon and reconciler image
  tag: ""            # empty means .Chart.AppVersion
  pullPolicy: IfNotPresent # applied to the daemon and reconciler containers
sessionImage:
  repository: ghcr.io/craig-ai-tooling/crswd-session # the image each session pod runs
  tag: ""            # empty means .Chart.AppVersion
reconciler:
  namespace: ""      # empty means <release namespace>-reconciler
  createNamespace: true # create that namespace; set false if it already exists
sharedSecret:
  existingSecret: "" # required: a Secret with key "secret" (openssl rand -hex 32)
dashboardPassword:
  existingSecret: "" # optional: a Secret with key "password"; the browser door without Access
startCommands: "default=claude --dangerously-skip-permissions,codex=/usr/local/bin/codex --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust" # both runtimes, one entry each
sessionNode: ""      # required: the amd64 node that holds the claim (RWO); every session pod runs there (FR-010)
claudeCredentials:
  secretName: claude-credentials # the namespace's Claude Code sign-in Secret
codexAuth:
  secretName: codex-auth # the namespace's Codex sign-in Secret, never a host's auth.json
allowedRoots: /work  # directories a session may start in, inside the session pod
maxSessions: 10      # the ceiling on concurrent sessions
storage:
  storageClassName: linstor-replicated # a ReadWriteOnce class
  size: 50Gi         # the claim every session's /work lives on
nodeSelector: {}     # for the daemon and reconciler pods
tolerations:         # for the daemon and reconciler pods
  - key: drbd.linbit.com/lost-quorum
    operator: Exists
    effect: NoSchedule
service:
  enabled: false     # true adds a ClusterIP Service and listens on 0.0.0.0; needs a browser door
  port: 8765         # the Service port and the daemon's listen port when enabled
access:
  teamDomain: ""     # Cloudflare Access team domain; setting it selects the Access door
  aud: ""            # the Access application audience tag
  allowedEmailsSecret: # a Secret holding the comma-separated addresses the Access door admits; required with teamDomain
    name: ""
    key: ""
cloudflared:
  enabled: false     # run a cloudflared sidecar beside the daemon
  image: docker.io/cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07 # 2026.10.0; the sidecar image, bump per docs/k8s-mode.md
  tokenSecret: ""    # a Secret with key "token"
