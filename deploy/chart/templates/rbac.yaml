apiVersion: v1
kind: ServiceAccount
metadata:
  name: crswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "daemon") | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crswd-reconciler
  namespace: {{ include "crswd.reconcilerNamespace" . }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "reconciler") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "daemon") | nindent 4 }}
rules: {{ (.Files.Get "files/rules.json" | fromJson).daemon | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "daemon") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crswd
subjects:
  - kind: ServiceAccount
    name: crswd
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crswd-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "reconciler") | nindent 4 }}
rules: {{ (.Files.Get "files/rules.json" | fromJson).reconciler | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crswd-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crswd-reconciler
subjects:
  - kind: ServiceAccount
    name: crswd-reconciler
    namespace: {{ include "crswd.reconcilerNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crswd-reconciler-lease
  namespace: {{ include "crswd.reconcilerNamespace" . }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "reconciler") | nindent 4 }}
rules: {{ (.Files.Get "files/rules.json" | fromJson).lease | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crswd-reconciler-lease
  namespace: {{ include "crswd.reconcilerNamespace" . }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "reconciler") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crswd-reconciler-lease
subjects:
  - kind: ServiceAccount
    name: crswd-reconciler
    namespace: {{ include "crswd.reconcilerNamespace" . }}
