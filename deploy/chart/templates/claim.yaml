apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crswd-sessions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "sessions") | nindent 4 }}
  annotations:
    # An uninstall keeps every conversation (FR-010 Retain).
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
