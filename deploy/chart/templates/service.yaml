{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: crswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crswd.labels" (dict "root" . "component" "daemon") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "crswd.selectorLabels" (dict "root" . "component" "daemon") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- end }}
